# docker compose up
#
# The server, with the demo page at http://localhost:8080/
services:
  netcluster:
    # Builds from source. To run the published image without building, drop the
    # `build` line: docker compose pull && docker compose up
    build: .
    image: renatex314/netcluster-server:latest
    ports:
      - "8080:8080"
    environment:
      NETCLUSTER_ADDR: "0.0.0.0:8080"
      NETCLUSTER_SWEEP_SECONDS: "10"
      # On, so the demo page can create its collection on first write. Turn this
      # off anywhere real -- see docs/DEPLOY.md.
      NETCLUSTER_AUTO_CREATE: "1"
      # Survive `docker compose restart` and container crashes. Remove this line
      # (or the volume) to go back to the stateless default.
      NETCLUSTER_DATA_DIR: /data
      NETCLUSTER_SNAPSHOT_SECONDS: "60"
    # The binary probes itself; the image carries no shell to curl with.
    healthcheck:
      test: ["CMD", "/usr/local/bin/netcluster-server", "--health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    volumes:
      - ncdata:/data
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  ncdata:
