[package]
name = "netcluster-server"
description = "A clustering server: ingest moving points, serve clustered vector tiles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "netcluster_server"
path = "src/lib.rs"

[[bin]]
name = "netcluster-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.4"
netcluster = { path = "../netcluster", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
