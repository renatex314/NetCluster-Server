[package]
name = "netcluster-server"
description = "A clustering server: ingest moving points, serve clustered vector tiles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "netcluster_server"
path = "src/lib.rs"

[[bin]]
name = "netcluster-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.4"
# No version requirement on purpose. Both crates take their version from
# [workspace.package], so pinning one here means two places have to agree on
# every release -- and the first bump that forgot broke the build. This server
# is shipped as a container, not published to crates.io, so the path alone is
# all cargo needs.
netcluster = { path = "../netcluster" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
