<!doctype html>
<meta charset="utf-8">
<title>netcluster-server</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:#151a21; --line:#242c37; --fg:#e6edf3; --dim:#8b97a6; --hot:#ff9f45; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #map { position:absolute; inset:0; }
  #panel { position:absolute; top:12px; left:12px; width:280px; z-index:2;
           background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line);
           border-radius:10px; padding:14px 16px; backdrop-filter:blur(8px); }
  h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:11px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
  .row b { font-weight:600; font-variant-numeric:tabular-nums; }
  .hot { color:var(--hot); }
  button { width:100%; margin-top:12px; padding:8px; background:#1e2733; color:var(--fg);
           border:1px solid var(--line); border-radius:6px; font:inherit; cursor:pointer; }
  button:hover { background:#25313f; }
  select { width:100%; margin-top:8px; padding:6px; background:#1e2733; color:var(--fg);
           border:1px solid var(--line); border-radius:6px; font:inherit; }
  #info { position:absolute; bottom:12px; left:12px; z-index:2; color:var(--dim); font-size:11px;
          background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line);
          border-radius:8px; padding:8px 12px; max-width:420px; }
</style>

<div id="map"></div>
<div id="panel">
  <h1>netcluster-server</h1>
  <div class="sub">clustered vector tiles, no rebuild</div>
  <div class="row"><span>devices</span><b id="s-dev">0</b></div>
  <div class="row"><span>reports sent</span><b id="s-sent">0</b></div>
  <div class="row"><span>reports/s</span><b id="s-rate" class="hot">0</b></div>
  <div class="row"><span>tile fetch</span><b id="s-tile">–</b></div>
  <div class="row"><span>index memory</span><b id="s-mem">–</b></div>
  <div class="row"><span>fast-path moves</span><b id="s-fast">–</b></div>
  <select id="fleet">
    <option value="2000">2,000 vehicles</option>
    <option value="10000" selected>10,000 vehicles</option>
    <option value="50000">50,000 vehicles</option>
    <option value="200000">200,000 vehicles</option>
  </select>
  <button id="go">start</button>
</div>
<div id="info">Press <b>start</b> to put a simulated fleet on the map. Every vehicle then moves continuously and the index is never rebuilt — click a cluster to see what is inside it.</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const COLLECTION = 'demo';
const API = location.origin + '/v1/collections/' + COLLECTION;
const $ = id => document.getElementById(id);

// Brazilian cities, roughly weighted by how many vehicles would actually be there.
const HUBS = [
  [-46.633, -23.550, 30], [-43.173, -22.907, 16], [-47.882, -15.794, 8],
  [-38.523, -3.732,  7], [-34.877, -8.047,  6], [-51.230, -30.033, 6],
  [-49.273, -25.428, 5], [-35.735, -9.666,  4], [-60.025, -3.101,  4],
  [-48.504, -1.455,  4], [-38.501, -12.971, 6], [-44.038, -19.921, 8],
];
const TOTAL_W = HUBS.reduce((a, h) => a + h[2], 0);
function hub() {
  let r = Math.random() * TOTAL_W;
  for (const h of HUBS) { if ((r -= h[2]) <= 0) return h; }
  return HUBS[0];
}

let fleet = [], sent = 0, running = false, timer = null, lastTick = 0, rateAcc = 0;
let infoDefault = '';

function makeFleet(n) {
  fleet = new Array(n);
  for (let i = 0; i < n; i++) {
    const h = hub();
    const a = Math.random() * Math.PI * 2;
    fleet[i] = {
      id: 'v' + i,
      lng: h[0] + (Math.random() - 0.5) * 0.55,
      lat: h[1] + (Math.random() - 0.5) * 0.55,
      hx: Math.cos(a) * 0.00035, hy: Math.sin(a) * 0.00035,
    };
  }
}

// Vehicles creep and occasionally turn -- the realistic case, and the one the
// index's fast path exists for.
function step() {
  for (const v of fleet) {
    if (Math.random() < 0.02) {
      const a = Math.random() * Math.PI * 2;
      v.hx = Math.cos(a) * 0.00035; v.hy = Math.sin(a) * 0.00035;
    }
    v.lng += v.hx; v.lat += v.hy;
  }
}

// Chunked, for the same reason the Node client defaults to 1000: one request
// holds the server's write lock for its whole duration, so batch size is the
// head-of-line delay every reader pays. It is also a hard requirement -- the whole
// fleet in one body exceeds the server's 2 MB request limit past about 40,000
// vehicles, which this page used to do silently.
const BATCH = 1000;

async function push() {
  if (!running) return;
  step();
  const t0 = performance.now();
  let devices = 0, ok = true;
  for (let i = 0; i < fleet.length && running; i += BATCH) {
    const body = fleet.slice(i, i + BATCH)
      .map(v => ({ id: v.id, lng: +v.lng.toFixed(6), lat: +v.lat.toFixed(6) }));
    try {
      const r = await fetch(API + '/positions', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        // Say so. Silently retrying a request that will never succeed is how this
        // page came to show zeros with no explanation.
        fail(`ingest failed: ${r.status} ${(await r.text()).slice(0, 120)}`);
        ok = false;
        break;
      }
      const j = await r.json();
      devices = j.devices ?? devices;
      sent += body.length; rateAcc += body.length;
    } catch (e) {
      fail(`cannot reach the server: ${e.message}`);
      ok = false;
      break;
    }
  }
  if (ok) {
    clearFail();
    $('s-dev').textContent = devices.toLocaleString();
    $('s-sent').textContent = sent.toLocaleString();
  }
  const dt = performance.now() - t0;
  if (running) timer = setTimeout(push, Math.max(120, 500 - dt));
}

function fail(msg) {
  const el = $('info');
  el.style.color = '#ff8a8a';
  el.textContent = msg;
}
function clearFail() {
  const el = $('info');
  if (el.style.color) { el.style.color = ''; el.textContent = infoDefault; }
}

setInterval(() => {
  $('s-rate').textContent = Math.round(rateAcc).toLocaleString();
  rateAcc = 0;
}, 1000);

let sizedFromServer = false;
async function poll() {
  try {
    const s = await (await fetch(API)).json();
    $('s-mem').textContent = (s.memory_bytes / 1e6).toFixed(0) + ' MB';
    $('s-fast').textContent = s.moves_fast_pct.toFixed(1) + '%';
    // Size the markers from the geometry the server is actually using, rather
    // than a number hard-coded here that could drift away from it.
    if (!sizedFromServer && s.radius && map.getLayer('clusters')) {
      MAX_R = Math.max(MIN_R + 2, s.radius / 2 - 3);
      map.setPaintProperty('clusters', 'circle-radius', radiusExpr(MAX_R));
      map.setLayoutProperty('cluster-count', 'text-size', textExpr(MAX_R));
      sizedFromServer = true;
    }
  } catch (e) { /* stats are cosmetic; ingest reports its own failures */ }
}
setInterval(poll, 2000);

infoDefault = $('info').textContent;

// Marker size is not a free choice. The server clusters at `radius` screen pixels
// (40 by default) against a 512-unit tile extent, and MapLibre renders vector
// sources at 512 px tiles -- so cluster centres are at least `radius` CSS pixels
// apart on screen. A circle of radius `radius/2` therefore just touches its
// neighbour, and anything larger overlaps. That is why zooming out used to turn
// into a pile of overlapping discs: the old scale went up to 52 px radius against
// a 40 px separation.
//
// So the size range is deliberately narrow and the *number* carries the magnitude.
let MAX_R = 17;
const MIN_R = 9;

// log10 of the count, so 10 and 100 and 1000 are evenly spaced rather than the
// first cluster eating the whole scale.
const radiusExpr = (maxR) => [
  'interpolate', ['linear'], ['log10', ['max', ['get', 'point_count'], 1]],
  0, MIN_R,
  1, MIN_R + (maxR - MIN_R) * 0.35,
  2, MIN_R + (maxR - MIN_R) * 0.6,
  3, MIN_R + (maxR - MIN_R) * 0.8,
  5.5, maxR,
];
const textExpr = (maxR) => [
  'interpolate', ['linear'], ['log10', ['max', ['get', 'point_count'], 1]],
  0, 10,
  2, 11,
  5.5, Math.min(13, maxR * 0.8),
];

const map = new maplibregl.Map({
  container: 'map',
  center: [-46.63, -23.55], zoom: 4,
  attributionControl: { compact: true },
  style: {
    version: 8,
    // MapLibre cannot draw text without a glyph source. This is MapLibre's own
    // keyless server; if it fails, the circles still render and only the numbers
    // are missing.
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      // A keyless dark basemap, so this page needs no API key to be useful. If you
      // adapt this for anything real, point it at your own tile source: CARTO's
      // free tiles are fine for a demo and not a licence to serve production
      // traffic. The `bg` layer below stays as a floor, so the clusters remain
      // visible even if these tiles fail to load.
      basemap: {
        type: 'raster',
        tiles: [
          'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
          'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
          'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png',
        ],
        tileSize: 256,
        maxzoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      },
      fleet: {
        type: 'vector',
        tiles: [API + '/tiles/{z}/{x}/{y}.mvt'],
        minzoom: 0, maxzoom: 16,
      },
      // One point, the cluster you just clicked, so the split has a visible origin.
      pulse: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#0b0d10' } },
      { id: 'basemap', type: 'raster', source: 'basemap', paint: { 'raster-opacity': 0.85 } },
      {
        id: 'pulse', type: 'circle', source: 'pulse',
        paint: {
          'circle-radius': 0,
          'circle-color': '#ffce7a',
          'circle-opacity': 0,
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffce7a',
          'circle-stroke-opacity': 0,
        },
      },
      {
        id: 'points', type: 'circle', source: 'fleet', 'source-layer': 'clusters',
        filter: ['!=', ['get', 'cluster'], true],
        paint: { 'circle-radius': 3, 'circle-color': '#ffce7a', 'circle-opacity': 0.9 },
      },
      {
        id: 'clusters', type: 'circle', source: 'fleet', 'source-layer': 'clusters',
        filter: ['==', ['get', 'cluster'], true],
        paint: {
          'circle-radius': radiusExpr(MAX_R),
          'circle-color': ['interpolate', ['linear'], ['log10', ['max', ['get', 'point_count'], 1]],
                            0, '#ffce7a', 1, '#ff9f45', 2, '#f4633a', 3.5, '#c62f5a'],
          'circle-opacity': 0.88,
          'circle-stroke-width': 1.5,
          'circle-stroke-color': 'rgba(255,255,255,0.45)',
          // Paint transitions: zooming changes these continuously rather than
          // snapping, which is most of what reads as "the clusters animated".
          'circle-radius-transition': { duration: 320 },
          'circle-color-transition': { duration: 320 },
          'circle-opacity-transition': { duration: 260 },
        },
      },
      {
        id: 'cluster-count', type: 'symbol', source: 'fleet', 'source-layer': 'clusters',
        filter: ['==', ['get', 'cluster'], true],
        layout: {
          'text-field': ['get', 'point_count_abbreviated'],
          'text-font': ['Noto Sans Bold'],
          'text-size': textExpr(MAX_R),
          // The number belongs to its circle, so it is drawn whether or not the
          // labeller thinks there is room. Without this, the counts that matter
          // most -- dense areas -- are the ones that disappear.
          'text-allow-overlap': true,
          'text-ignore-placement': true,
        },
        paint: {
          'text-color': '#1a1206',
          'text-halo-color': 'rgba(255,255,255,0.55)',
          'text-halo-width': 0.8,
        },
      },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

// Tiles must be re-fetched as vehicles move; a fresh query string is the simplest
// way to defeat both the browser cache and MapLibre's own.
let tileT0 = 0;
function refresh() {
  const src = map.getSource('fleet');
  if (!src) return;
  tileT0 = performance.now();
  src.setTiles([API + '/tiles/{z}/{x}/{y}.mvt?t=' + Date.now()]);
}
map.on('sourcedata', e => {
  if (e.sourceId === 'fleet' && e.isSourceLoaded && tileT0) {
    $('s-tile').textContent = Math.round(performance.now() - tileT0) + ' ms';
    tileT0 = 0;
  }
});
setInterval(() => { if (running) refresh(); }, 1000);

// A ring that expands and fades from the clicked cluster while the map eases into
// the zoom where it splits. MapLibre has no notion of "this cluster became those
// three" -- tiles are replaced wholesale and cluster ids are explicitly unstable
// across updates -- so the animation marks *where* the split happens rather than
// morphing one marker into several.
function ripple(lngLat, ms = 650) {
  map.getSource('pulse').setData({
    type: 'FeatureCollection',
    features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [lngLat.lng, lngLat.lat] }, properties: {} }],
  });
  const t0 = performance.now();
  const frame = () => {
    const t = Math.min(1, (performance.now() - t0) / ms);
    const ease = 1 - Math.pow(1 - t, 3);
    map.setPaintProperty('pulse', 'circle-radius', MAX_R + ease * 70);
    map.setPaintProperty('pulse', 'circle-stroke-opacity', 0.7 * (1 - ease));
    map.setPaintProperty('pulse', 'circle-opacity', 0.18 * (1 - ease));
    if (t < 1) requestAnimationFrame(frame);
    else map.getSource('pulse').setData({ type: 'FeatureCollection', features: [] });
  };
  requestAnimationFrame(frame);
}

map.on('click', 'clusters', async e => {
  const p = e.features[0].properties;
  const cid = e.features[0].id;
  ripple(e.lngLat);
  try {
    const r = await (await fetch(API + '/clusters/' + cid + '/children')).json();
    if (r.expansion_zoom != null) {
      // Slow enough to watch the cluster come apart. The markers resize
      // continuously on the way, because circle-radius is a paint transition.
      map.easeTo({
        center: e.lngLat, zoom: r.expansion_zoom,
        duration: 900, easing: t => t * (2 - t),
      });
    }
    $('info').textContent = `cluster of ${Number(p.point_count).toLocaleString()} vehicles ` +
                            `-> splits into ${r.features?.length ?? 0} at zoom ${r.expansion_zoom}`;
  } catch (err) {
    $('info').textContent = 'that cluster is already gone -- handles are invalidated by movement';
  }
});
map.on('mouseenter', 'clusters', () => map.getCanvas().style.cursor = 'pointer');
map.on('mouseleave', 'clusters', () => map.getCanvas().style.cursor = '');

$('go').onclick = async () => {
  if (running) {
    running = false; clearTimeout(timer); $('go').textContent = 'start'; return;
  }
  const n = +$('fleet').value;
  $('go').textContent = 'building fleet...';
  await new Promise(r => setTimeout(r, 10));
  makeFleet(n);
  await fetch(API, { method: 'PUT', headers: { 'content-type': 'application/json' },
                     body: JSON.stringify({ ttl_seconds: 60 }) }).catch(() => {});
  running = true; $('go').textContent = 'stop';
  push(); refresh(); poll();
};
</script>
